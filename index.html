<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản đồ lớp học tiếng Việt toàn cầu – VIETLANGNET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Bố cục: thanh xanh navy trên cùng, header trắng như site chính, danh sách lớp bên trái, bản đồ bên phải.
   Màu lấy theo theme VIETLANGNET (brand-navy, brand-deep, brand-blue, brand-gold). Site chính chỉ có giao diện sáng nên trang này cũng vậy. */
:root {
  --navy: #0b2545;
  --deep: #133e6f;
  --blue: #195bb0;
  --gold: #e09f3e;
  --gold-soft: #f9f3e8;
  --bg: #fbfcfd;
  --surface: #ffffff;
  --fg: #1e293b;
  --muted: #64748b;
  --line: #e2e8f0;
  --chip: #f1f5f9;
  --ocean: #dbe4ee;
  --font: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; }
.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Thanh trên cùng, giống thanh "Tin mới" của site */
.utility { background: var(--navy); color: #cbd5e1; font-size: 12px; padding-block: 8px; border-bottom: 1px solid rgba(255,255,255,.1); }
.utility .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.utility a { color: #cbd5e1; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.utility a:hover { color: var(--gold); }
.utility svg { width: 12px; height: 12px; fill: currentColor; }
.demo-pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
  background: rgba(224,159,62,.18); color: var(--gold); border: 1px solid rgba(224,159,62,.35); font-weight: 600; font-size: 11px;
}
.demo-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

/* Header trắng với logo, giống header site */
.header { background: rgba(255,255,255,.97); border-bottom: 1px solid #f1f5f9; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
.header .row { min-height: 72px; display: flex; align-items: center; gap: 16px 24px; flex-wrap: wrap; padding-block: 10px; }
.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.logo img { width: 40px; height: 40px; border-radius: 50%; object-fit: contain; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.logo-name { display: flex; align-items: center; gap: 6px; font-size: 19px; font-weight: 800; color: var(--navy); letter-spacing: -.01em; }
.logo-name i { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: inline-block; }
.logo-sub { font-size: 10.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.divider { width: 1px; align-self: stretch; background: var(--line); margin-block: 8px; }
.title { margin-right: auto; min-width: 0; }
.title h1 { margin: 0; font-size: 17px; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: -.005em; text-wrap: balance; }
.title p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; fill: #94a3b8; pointer-events: none; }
.filters input, .filters select {
  font: inherit; font-size: 13px; color: var(--fg); background: #f8fafc; border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 12px; min-width: 0; transition: border-color .15s, box-shadow .15s;
}
.filters input { width: 240px; max-width: 100%; padding-left: 34px; }
.filters input:focus, .filters select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(25,91,176,.15); background: #fff; }
button:focus-visible, .item:focus-visible, .chip:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* Danh sách lớp bên trái */
.main { display: grid; grid-template-columns: 340px 1fr; min-height: 0; position: relative; }
.panel { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--line); }
.panel-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { color: var(--navy); font-weight: 800; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 11.5px; font-weight: 600; border: 0; cursor: pointer; border-radius: 10px; padding: 6px 11px;
  background: var(--chip); color: #334155; transition: background .15s;
}
.chip:hover { background: #e2e8f0; }
.chip[aria-pressed="true"] { background: var(--navy); color: #fff; box-shadow: 0 1px 2px rgba(11,37,69,.3); }
.list { overflow-y: auto; margin: 0; padding: 8px; list-style: none; display: grid; gap: 6px; align-content: start; }
.item {
  display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; padding: 12px; cursor: pointer;
  border-radius: 14px; border: 1px solid transparent; transition: background .15s, border-color .15s;
}
.item:hover { background: #f8fafc; border-color: var(--line); }
.item.active { background: var(--gold-soft); border-color: rgba(224,159,62,.45); }
.item .pin { grid-row: span 3; width: 30px; height: 30px; border-radius: 10px; background: var(--navy); display: grid; place-items: center; margin-top: 2px; }
.item.active .pin { background: var(--gold); }
.item .pin svg { width: 14px; height: 14px; fill: var(--gold); }
.item.active .pin svg { fill: var(--navy); }
.item b { font-weight: 700; font-size: 13.5px; color: var(--navy); line-height: 1.35; }
.item .meta { color: var(--muted); font-size: 12px; }
.tag { justify-self: start; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px; border-radius: 6px; background: #e0f2fe; color: #075985; margin-top: 3px; }
.empty { padding: 24px 12px; color: var(--muted); }

#map { min-height: 0; background: var(--ocean); }
.gm-style { font-family: var(--font) !important; }
.gm-style .gm-style-iw-c { border-radius: 16px !important; box-shadow: 0 12px 32px rgba(11,37,69,.22) !important; }

/* Popup thông tin lớp */
.pop { width: 280px; max-width: 70vw; color: var(--fg); font-family: var(--font); padding: 0 2px 4px; }
.pop .tag { margin: 0; }
.pop h3 { margin: 8px 0 4px; font-size: 15.5px; font-weight: 800; line-height: 1.35; color: var(--navy); text-wrap: balance; }
.pop .where { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
.pop dl { display: grid; grid-template-columns: 82px 1fr; gap: 7px 10px; margin: 0 0 14px; font-size: 12.5px; padding-top: 12px; border-top: 1px solid var(--line); }
.pop dt { color: var(--muted); }
.pop dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.pop .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pop .copy { font: inherit; font-size: 11px; border: 1px solid var(--line); background: #f8fafc; color: var(--fg); border-radius: 6px; padding: 1px 7px; cursor: pointer; }
.pop .actions { display: flex; gap: 8px; }
.pop .btn {
  flex: 1; text-align: center; text-decoration: none; font-weight: 700; font-size: 12.5px; padding: 10px 8px; border-radius: 12px;
  background: var(--navy); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.pop .btn:hover { background: var(--deep); }
.pop .btn svg { width: 12px; height: 12px; fill: var(--gold); }

.toggle-list { display: none; }

@media (max-width: 900px) {
  .divider { display: none; }
  .title { flex-basis: 100%; order: 2; }
  .filters { order: 3; flex-basis: 100%; }
  .filters .search { flex: 1 1 200px; }
  .filters input { width: 100%; }
  .filters select { flex: 1 1 140px; }
}
@media (max-width: 760px) {
  .logo-sub, .title p { display: none; }
  .header .row { min-height: 0; gap: 10px; }
  .main { grid-template-columns: 1fr; }
  .panel { position: absolute; inset: 0; z-index: 1000; border-right: 0; }
  .panel[data-open="false"] { display: none; }
  .toggle-list {
    display: inline-flex; align-items: center; gap: 8px; position: absolute; z-index: 1001;
    left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    font: inherit; font-weight: 700; font-size: 13px; padding: 11px 16px; border-radius: 999px; border: 0;
    background: var(--navy); color: #fff; box-shadow: 0 6px 18px rgba(11,37,69,.35); cursor: pointer;
  }
  .toggle-list i { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="utility wrap">
    <div class="row">
      <a href="https://vietnamese-network.net/">
        <svg viewBox="0 0 448 512" aria-hidden="true"><path d="M9.4 233.4a32 32 0 0 0 0 45.3l160 160a32 32 0 0 0 45.3-45.3L109.3 288H416a32 32 0 1 0 0-64H109.3l105.3-105.4a32 32 0 0 0-45.3-45.3l-160 160z"/></svg>
        Về trang chủ VIETLANGNET
      </a>
      <span class="demo-pill">Bản demo · dữ liệu mẫu</span>
    </div>
  </div>

  <header class="header wrap">
    <div class="row">
      <a class="logo" href="https://vietnamese-network.net/" aria-label="VIETLANGNET – Trang chủ">
        <img src="https://vietnamese-network.net/wp-content/themes/vietlangnet-wordpress-theme/assets/img/logo.png" alt="">
        <span>
          <span class="logo-name">VIETLANGNET <i></i></span>
          <span class="logo-sub">Mạng lưới tiếng Việt toàn cầu</span>
        </span>
      </a>
      <span class="divider" aria-hidden="true"></span>
      <div class="title">
        <h1>Bản đồ lớp học tiếng Việt toàn cầu</h1>
        <p>Bấm vào ghim trên bản đồ hoặc chọn lớp trong danh sách để xem thông tin.</p>
      </div>
      <div class="filters">
        <label class="search">
          <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M416 208c0 45.9-14.9 88.3-40 122.7l126.6 126.7a32 32 0 0 1-45.3 45.3L330.7 376A208 208 0 1 1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>
          <input id="q" type="search" placeholder="Tìm tên lớp, thành phố…" aria-label="Tìm lớp học">
        </label>
        <select id="country" aria-label="Lọc theo quốc gia"><option value="">Tất cả quốc gia</option></select>
      </div>
    </div>
  </header>

  <div class="main">
    <aside class="panel" id="panel" data-open="false">
      <div class="panel-head">
        <div class="count" id="count"></div>
        <div class="chips" id="regions" role="group" aria-label="Lọc theo khu vực"></div>
      </div>
      <ul class="list" id="list"></ul>
    </aside>
    <div id="map" role="region" aria-label="Bản đồ thế giới"></div>
    <button class="toggle-list" id="toggle" type="button"><i></i><span>Danh sách lớp</span></button>
  </div>
</div>

    '<g transform="translate(8 7) scale(0.8333)" fill="' + fg + '">' + BOOK + '</g></svg>');
}

function popupHtml(c) {
  const dir = "https://www.google.com/maps/dir/?api=1&destination=" + c.lat + "," + c.lng;
  return `<div class="pop">
    <span class="tag">${esc(c.model)}</span>
    <h3>${esc(c.name)}</h3>
    <p class="where">${esc(c.city)}, ${esc(c.country)}</p>
    <dl>
      <dt>Điện thoại</dt><dd class="row"><span>${esc(c.phone)}</span><button class="copy" type="button" data-copy="${esc(c.phone)}">Sao chép</button></dd>
      <dt>Email</dt><dd>${esc(c.email)}</dd>
      <dt>Địa chỉ</dt><dd>${esc(c.address)}</dd>
      <dt>Độ tuổi</dt><dd>${esc(c.ages)}</dd>
      <dt>Lịch học</dt><dd>${esc(c.schedule)}</dd>
      <dt>Ngôn ngữ</dt><dd>${esc(c.lang)}</dd>
    </dl>
    <div class="actions"><a class="btn" href="${dir}" target="_blank" rel="noopener"><svg viewBox="0 0 384 512" aria-hidden="true"><path d="M215.7 499.2C267 435 384 279.4 384 192 384 86 298 0 192 0S0 86 0 192c0 87.4 117 243 168.3 307.2a30.2 30.2 0 0 0 47.4 0zM192 128a64 64 0 1 1 0 128 64 64 0 1 1 0-128z"/></svg>Chỉ đường</a></div>
  </div>`;
}

function initMap() {
  const ICON = { url: pinSvg(NAVY, GOLD), scaledSize: new google.maps.Size(32, 41), anchor: new google.maps.Point(16, 41) };
  const ICON_ACTIVE = { url: pinSvg(GOLD, NAVY), scaledSize: new google.maps.Size(40, 51), anchor: new google.maps.Point(20, 51) };

  const map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 25, lng: 110 }, zoom: 3, minZoom: 2, styles: MAP_STYLE,
    mapTypeControl: true,
    mapTypeControlOptions: { style: google.maps.MapTypeControlStyle.HORIZONTAL_BAR, position: google.maps.ControlPosition.TOP_RIGHT, mapTypeIds: ["roadmap", "hybrid"] },
    streetViewControl: false, fullscreenControl: false, gestureHandling: "greedy",
  });
  const info = new google.maps.InfoWindow({ maxWidth: 320 });
  let activeId = null;

  const markers = new Map();
  CLASSES.forEach(c => {
    const m = new google.maps.Marker({ position: { lat: c.lat, lng: c.lng }, icon: ICON, title: c.name });
    m.addListener("click", () => { info.setContent(popupHtml(c)); info.open({ map, anchor: m }); setActive(c.id); });
    markers.set(c.id, m);
  });
  info.addListener("closeclick", () => setActive(null));

  const renderer = {
    render: ({ count, position }) => new google.maps.Marker({
      position, zIndex: 1000 + count,
      label: { text: String(count), color: "#ffffff", fontWeight: "800", fontSize: "13px", fontFamily: "Be Vietnam Pro, sans-serif" },
      icon: {
        url: svgUrl('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"><circle cx="24" cy="24" r="22" fill="' + GOLD + '" fill-opacity=".35"/><circle cx="24" cy="24" r="16" fill="' + NAVY + '" stroke="' + GOLD + '" stroke-width="2.5"/></svg>'),
        scaledSize: new google.maps.Size(48, 48), anchor: new google.maps.Point(24, 24),
      },
    }),
  };
  const clusterer = new markerClusterer.MarkerClusterer({ map, renderer });

  document.addEventListener("click", e => {
    const b = e.target.closest(".copy");
    if (!b) return;
    navigator.clipboard?.writeText(b.dataset.copy).then(() => {
      b.textContent = "Đã chép"; setTimeout(() => (b.textContent = "Sao chép"), 1500);
    });
  });

  const sel = document.getElementById("country");
  [...new Set(CLASSES.map(c => c.country))]
    .map(n => [n, CLASSES.filter(c => c.country === n).length])
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "vi"))
    .forEach(([n, k]) => sel.add(new Option(`${n} (${k})`, n)));

  let region = "";
  const chipsEl = document.getElementById("regions");
  chipsEl.innerHTML = [["", `Tất cả (${CLASSES.length})`], ...REGIONS.filter(r => CLASSES.some(c => c.region === r)).map(r => [r, r])]
    .map(([v, t]) => `<button class="chip" type="button" data-region="${esc(v)}" aria-pressed="${v === ""}">${esc(t)}</button>`).join("");
  chipsEl.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    region = b.dataset.region;
    chipsEl.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    render(true);
  });

  const listEl = document.getElementById("list");
  const countEl = document.getElementById("count");
  const panel = document.getElementById("panel");
  const toggle = document.getElementById("toggle");
  const toggleText = toggle.querySelector("span");
  const mobile = matchMedia("(max-width: 760px)");

  function setActive(id) {
    if (activeId !== null && markers.get(activeId)) { markers.get(activeId).setIcon(ICON); markers.get(activeId).setZIndex(undefined); }
    activeId = id;
    if (id !== null) { markers.get(id).setIcon(ICON_ACTIVE); markers.get(id).setZIndex(9999); }
    listEl.querySelectorAll(".item").forEach(li => li.classList.toggle("active", +li.dataset.id === id));
    const li = listEl.querySelector(".item.active");
    if (li && !mobile.matches) li.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function render(fit) {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const ct = sel.value;
    const rows = CLASSES.filter(c => (!ct || c.country === ct) && (!region || c.region === region) &&
      (!q || (c.name + " " + c.city + " " + c.country + " " + c.code).toLowerCase().includes(q)));
    clusterer.clearMarkers();
    clusterer.addMarkers(rows.map(c => markers.get(c.id)));
    info.close(); setActive(null);
    countEl.innerHTML = `Hiển thị <b>${rows.length}</b> / ${CLASSES.length} lớp học`;
    listEl.innerHTML = rows.length ? rows.map(c => `
      <li class="item" tabindex="0" data-id="${c.id}">
        <span class="pin">${bookSvg}</span>
        <b>${esc(c.name)}</b>
        <span class="meta">${esc(c.city)}, ${esc(c.country)}</span>
        <span class="tag">${esc(c.model)}</span>
      </li>`).join("") : '<li class="empty">Không có lớp nào khớp với tìm kiếm.</li>';
    if (rows.length && fit) {
      const b = new google.maps.LatLngBounds();
      rows.forEach(c => b.extend({ lat: c.lat, lng: c.lng }));
      map.fitBounds(b, 60);
      google.maps.event.addListenerOnce(map, "idle", () => { if (map.getZoom() > 12) map.setZoom(12); });
    }
  }

  function openClass(id) {
    const c = CLASSES.find(x => x.id === id);
    if (mobile.matches) { panel.dataset.open = "false"; toggleText.textContent = "Danh sách lớp"; }
    map.panTo({ lat: c.lat, lng: c.lng });
    map.setZoom(14);
    google.maps.event.addListenerOnce(map, "idle", () => google.maps.event.trigger(markers.get(id), "click"));
  }
  listEl.addEventListener("click", e => { const li = e.target.closest(".item"); if (li) openClass(+li.dataset.id); });
  listEl.addEventListener("keydown", e => { const li = e.target.closest(".item"); if (li && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openClass(+li.dataset.id); } });

  toggle.addEventListener("click", () => {
    const open = panel.dataset.open !== "true";
    panel.dataset.open = String(open);
    toggleText.textContent = open ? "Xem bản đồ" : "Danh sách lớp";
  });
  function syncPanel() { panel.dataset.open = mobile.matches ? "false" : "true"; toggleText.textContent = "Danh sách lớp"; }
  mobile.addEventListener("change", syncPanel);
  syncPanel();

  let t; document.getElementById("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => render(true), 200); });
  sel.addEventListener("change", () => render(true));
  render(false);
}
window.initMap = initMap;

(function loadGoogleMaps() {
  const s = document.createElement("script");
  s.src = "https://maps.googleapis.com/maps/api/js?callback=initMap&language=vi&v=weekly" +
    (GOOGLE_MAPS_API_KEY ? "&key=" + encodeURIComponent(GOOGLE_MAPS_API_KEY) : "");
  s.async = true;
  s.onerror = () => { document.getElementById("map").innerHTML = '<p class="empty">Không tải được Google Maps. Kiểm tra kết nối mạng hoặc API key.</p>'; };
  document.head.appendChild(s);
})();
</script>
</body>
