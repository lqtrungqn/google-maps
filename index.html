<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản đồ lớp học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app — top bar, class list on the left, world map filling the rest. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #16212b;
  --muted: #5d6b78;
  --line: #dde3e8;
  --accent: #0b6e6e;
  --accent-soft: #dcefee;
  --dot: #d1495b;
  --ocean: #cfdde6;
  --land: #f7f4ee;
  --border: #b9c7d1;
  --font: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f161c; --surface: #17212a; --fg: #e6edf2; --muted: #93a3b1; --line: #26333e;
  --accent: #4fc1bd; --accent-soft: #163a3a; --dot: #ff7a8a; --ocean: #0c1a24; --land: #24313b; --border: #3a4b58;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f161c; --surface: #17212a; --fg: #e6edf2; --muted: #93a3b1; --line: #26333e;
  --accent: #4fc1bd; --accent-soft: #163a3a; --dot: #ff7a8a; --ocean: #0c1a24; --land: #24313b; --border: #3a4b58;
  color-scheme: dark }

html, body { height: 100%; }
body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

.topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; margin-right: auto; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.demo-tag {
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 4px; align-self: flex-start;
}
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters input, .filters select {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 10px; min-width: 0;
}
.filters input { width: 220px; max-width: 100%; }
.filters input:focus-visible, .filters select:focus-visible, button:focus-visible, .item:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}

.main { display: grid; grid-template-columns: 320px 1fr; min-height: 0; position: relative; }
.panel { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--surface); }
.panel-head { padding: 10px 16px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.list { overflow-y: auto; margin: 0; padding: 0; list-style: none; }
.item {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); cursor: pointer;
}
.item:hover, .item.active { background: var(--accent-soft); }
.item .pin { grid-row: span 2; width: 10px; height: 10px; border-radius: 50%; background: var(--dot); margin-top: 5px; }
.item b { font-weight: 600; font-size: 13.5px; }
.item span { color: var(--muted); font-size: 12px; }
.empty { padding: 24px 16px; color: var(--muted); }

#map { min-height: 0; background: var(--ocean); }
.gm-style { font-family: var(--font); }
.pop { padding: 0 4px 6px; width: 270px; max-width: 70vw; color: #16212b; font-family: var(--font); }
.pop .code { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: #0b6e6e; text-transform: uppercase; }
.pop h3 { margin: 4px 0 10px; font-size: 15px; line-height: 1.35; text-wrap: balance; }
.pop dl { display: grid; grid-template-columns: 74px 1fr; gap: 6px 8px; margin: 0 0 12px; font-size: 13px; }
.pop dt { color: #5d6b78; }
.pop dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pop .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pop .copy { font: inherit; font-size: 11px; border: 1px solid #dde3e8; background: #f3f5f7; color: #16212b; border-radius: 4px; padding: 1px 6px; cursor: pointer; }
.pop .actions { display: flex; gap: 8px; }
.pop .btn { flex: 1; text-align: center; text-decoration: none; font-weight: 600; font-size: 13px; padding: 8px; border-radius: 6px; background: #0b6e6e; color: #fff; }

.toggle-list { display: none; }

@media (max-width: 760px) {
  .main { grid-template-columns: 1fr; position: relative; }
  .panel { position: absolute; inset: 0; z-index: 1000; border-right: 0; }
  .panel[data-open="false"] { display: none; }
  .toggle-list {
    display: block; position: absolute; z-index: 1001;
    left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    font: inherit; font-weight: 600; padding: 10px 14px; border-radius: 20px; border: 0;
    background: var(--accent); color: var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,.25); cursor: pointer;
  }
  .filters, .filters input { width: 100%; }
  .filters select { flex: 1; }
}
@media (prefers-reduced-motion: reduce) { .dot { transition: none; } }
</style>

</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="demo-tag">Bản demo · dữ liệu mẫu · Google Maps</span>
      <h1>Bản đồ lớp học</h1>
      <p>Bấm vào chấm đỏ trên bản đồ để xem thông tin lớp.</p>
    </div>
    <div class="filters">
      <input id="q" type="search" placeholder="Tìm tên lớp, thành phố…" aria-label="Tìm lớp học">
      <select id="country" aria-label="Lọc theo quốc gia"><option value="">Tất cả quốc gia</option></select>
    </div>
  </header>
  <div class="main">
    <aside class="panel" id="panel" data-open="false">
      <div class="panel-head" id="count"></div>
      <ul class="list" id="list"></ul>
    </aside>
    <div id="map" role="region" aria-label="Bản đồ thế giới"></div>
    <button class="toggle-list" id="toggle" type="button">Danh sách lớp</button>
  </div>
</div>

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function popupHtml(c) {
  const dir = "https://www.google.com/maps/dir/?api=1&destination=" + c.lat + "," + c.lng;
  return `<div class="pop">
    <div class="code">${esc(c.code)} · ${esc(c.country)}</div>
    <h3>${esc(c.name)}</h3>
    <dl>
      <dt>Điện thoại</dt><dd class="row"><span>${esc(c.phone)}</span><button class="copy" type="button" data-copy="${esc(c.phone)}">Sao chép</button></dd>
      <dt>Email</dt><dd>${esc(c.email)}</dd>
      <dt>Địa chỉ</dt><dd>${esc(c.address)}</dd>
      <dt>Lịch học</dt><dd>${esc(c.schedule)}</dd>
      <dt>Sĩ số</dt><dd>${c.students} học viên</dd>
    </dl>
    <div class="actions"><a class="btn" href="${dir}" target="_blank" rel="noopener">Chỉ đường</a></div>
  </div>`;
}

let DOT;

function initMap() {
  DOT = { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: "#d1495b", fillOpacity: 1, strokeColor: "#ffffff", strokeWeight: 2.5 };

  const map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 25, lng: 110 }, zoom: 3, minZoom: 2,
    mapTypeControl: false, streetViewControl: false, fullscreenControl: true,
    gestureHandling: "greedy",
  });
  const info = new google.maps.InfoWindow({ maxWidth: 320 });

  const markers = new Map();
  CLASSES.forEach(c => {
    const m = new google.maps.Marker({ position: { lat: c.lat, lng: c.lng }, icon: DOT, title: c.name });
    m.addListener("click", () => { info.setContent(popupHtml(c)); info.open({ map, anchor: m }); setActive(c.id); });
    markers.set(c.id, m);
  });

  const renderer = {
    render: ({ count, position }) => new google.maps.Marker({
      position, zIndex: 1000 + count,
      label: { text: String(count), color: "#fff", fontWeight: "700", fontSize: "12px" },
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 16, fillColor: "#0b6e6e", fillOpacity: 0.95, strokeColor: "#0b6e6e", strokeOpacity: 0.3, strokeWeight: 8 },
    }),
  };
  const clusterer = new markerClusterer.MarkerClusterer({ map, renderer });

  document.addEventListener("click", e => {
    const b = e.target.closest(".copy");
    if (!b) return;
    navigator.clipboard?.writeText(b.dataset.copy).then(() => {
      b.textContent = "Đã chép"; setTimeout(() => (b.textContent = "Sao chép"), 1500);
    });
  });

  const sel = document.getElementById("country");
  [...new Set(CLASSES.map(c => c.country))]
    .map(n => [n, CLASSES.filter(c => c.country === n).length])
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "vi"))
    .forEach(([n, k]) => sel.add(new Option(`${n} (${k})`, n)));

  const listEl = document.getElementById("list");
  const countEl = document.getElementById("count");
  const panel = document.getElementById("panel");
  const toggle = document.getElementById("toggle");
  const mobile = matchMedia("(max-width: 760px)");

  function setActive(id) {
    listEl.querySelectorAll(".item").forEach(li => li.classList.toggle("active", +li.dataset.id === id));
  }

  function render() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const ct = sel.value;
    const rows = CLASSES.filter(c => (!ct || c.country === ct) &&
      (!q || (c.name + " " + c.city + " " + c.country + " " + c.code).toLowerCase().includes(q)));
    clusterer.clearMarkers();
    clusterer.addMarkers(rows.map(c => markers.get(c.id)));
    info.close();
    countEl.textContent = `Hiển thị ${rows.length} / ${CLASSES.length} lớp học`;
    listEl.innerHTML = rows.length ? rows.map(c => `
      <li class="item" tabindex="0" data-id="${c.id}">
        <i class="pin"></i><b>${esc(c.name)}</b><span>${esc(c.city)}, ${esc(c.country)} · ${esc(c.phone)}</span>
      </li>`).join("") : '<li class="empty">Không có lớp nào khớp với tìm kiếm.</li>';
    if (rows.length && (q || ct)) {
      const b = new google.maps.LatLngBounds();
      rows.forEach(c => b.extend({ lat: c.lat, lng: c.lng }));
      map.fitBounds(b, 60);
      google.maps.event.addListenerOnce(map, "idle", () => { if (map.getZoom() > 12) map.setZoom(12); });
    }
  }

  function openClass(id) {
    const c = CLASSES.find(x => x.id === id);
    if (mobile.matches) { panel.dataset.open = "false"; toggle.textContent = "Danh sách lớp"; }
    map.panTo({ lat: c.lat, lng: c.lng });
    map.setZoom(15);
    google.maps.event.addListenerOnce(map, "idle", () => google.maps.event.trigger(markers.get(id), "click"));
  }
  listEl.addEventListener("click", e => { const li = e.target.closest(".item"); if (li) openClass(+li.dataset.id); });
  listEl.addEventListener("keydown", e => { const li = e.target.closest(".item"); if (li && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openClass(+li.dataset.id); } });

  toggle.addEventListener("click", () => {
    const open = panel.dataset.open !== "true";
    panel.dataset.open = String(open);
    toggle.textContent = open ? "Xem bản đồ" : "Danh sách lớp";
  });
  function syncPanel() { panel.dataset.open = mobile.matches ? "false" : "true"; toggle.textContent = "Danh sách lớp"; }
  mobile.addEventListener("change", syncPanel);
  syncPanel();

  let t; document.getElementById("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(render, 200); });
  sel.addEventListener("change", render);
  render();
}
window.initMap = initMap;

(function loadGoogleMaps() {
  const s = document.createElement("script");
  s.src = "https://maps.googleapis.com/maps/api/js?callback=initMap&language=vi&v=weekly" +
    (GOOGLE_MAPS_API_KEY ? "&key=" + encodeURIComponent(GOOGLE_MAPS_API_KEY) : "");
  s.async = true;
  s.onerror = () => { document.getElementById("map").innerHTML = '<p class="empty">Không tải được Google Maps. Kiểm tra kết nối mạng hoặc API key.</p>'; };
  document.head.appendChild(s);
})();
